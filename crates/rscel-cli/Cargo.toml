[package]
name = "rscel-cli"
description = "rscel 命令行（check / build）—— 串接 parser → check → gen → rustc，附 §15.2 错误反映射"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rscel"
path = "src/main.rs"

[dependencies]
rscel-parser = { path = "../rscel-parser" }
rscel-check = { path = "../rscel-check" }
rscel-gen = { path = "../rscel-gen" }

[lib]
path = "src/lib.rs"
